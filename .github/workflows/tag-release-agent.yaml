name: Release agent

on:
  push:
    tags:
    - v*

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write
  actions: write

jobs:
  changes:
    name: Detect agent changes
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: filter
      run: bash .github/scripts/changed-since-prev-tag.sh '^(agent/|\.github/workflows/tag-release-agent\.yaml)'

  release-binary:
    name: "Release agent binary"
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
    - uses: mlugg/setup-zig@v2
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: agent
        shared-key: agent
        cache-bin: true
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Compile with goreleaser and publish release
      uses: goreleaser/goreleaser-action@v7
      with:
        args: release --skip=before
        version: "~> v2"
        workdir: agent
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
