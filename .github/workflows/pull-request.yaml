name: Pull request analysis

on:
  pull_request:
    branches:
    - "*"

jobs:
  gitleaks:
    name: "🔐 Scan for secrets"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_CONFIG: .gitleaks.toml
        GITLEAKS_VERSION: 8.30.1

  labels:
    name: Autodetect labels 🔍
    runs-on: ubuntu-latest
    steps:
    - name: Autodetect labels 🔍
      uses: tchoupinax/repo-config/shared-actions/steps/dx/automatically-apply-labels@v0
      with:
        appId: ${{ secrets.DEPLOY_APP_ID }}
        privateKey: ${{ secrets.DEPLOY_APP_KEY }}

  build-ui:
    name: "🟢 Build user interface (Nuxt.js project)"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: "Setup PNPM"
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Use Node.js 25
      uses: actions/setup-node@v7
      with:
        node-version: 25
        cache: "pnpm"

    - name: Build, lint and test the package
      run: |
        pnpm install --frozen-lockfile --filter webapp
        pnpm build --filter webapp

  build-server:
    name: "🟣 Build server and generate prisma"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: "Setup PNPM"
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: "pnpm"

    - name: "Build, lint and test the package"
      run: |
        pnpm install --frozen-lockfile --filter server
        pnpm build --filter server
      env:
        API_URL: "_"
        CI_COMMIT_SHA: "_"
        CI_PIPELINE_CREATED: "1"
        DATABASE_URL: "_"
        JOB_DEFAULT_TIMEOUT: "_"
        OIDC_CLIENT_ID: "_"
        OIDC_CLIENT_SECRET: "_"
        OIDC_CONFIGURATION_URL: "_"
        OIDC_PROVIDER_IMAGE: "_"
        OIDC_PROVIDER_NAME: "_"
        UI_URL: "_"
        VAULT_ADDR: "_"
        VAULT_PATH: "_"
        VAULT_TOKEN: "_"

  build-agent:
    name: "🔵 Build agent binary"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu
    - uses: mlugg/setup-zig@v2
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: agent
        shared-key: agent
        cache-bin: true
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild
    - name: Compile with goreleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        args: build --clean --snapshot --single-target --skip=before
        version: "~> v2"
        workdir: agent
