# https://github.com/marketplace/actions/helm-oci-chart-releaser
# https://github.com/bsord/helm-push

name: Release helm chart

on:
  push:
    tags:
    - v*

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write

jobs:
  changes:
    name: Detect chart changes
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: filter
      run: bash .github/scripts/changed-since-prev-tag.sh '^chart/|\.github/workflows/helm-chart\.yaml'

  build-helm-chart:
    name: "Push helm chart"
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Push Helm chart to OCI Github registry2
      uses: bsord/helm-push@v4.2.0
      with:
        useOCIRegistry: true
        registry-url: oci://ghcr.io/tchoupinax
        username: Tchoupinax
        access-token: ${{ secrets.OCI_PUSH_PASSWORD }}
        force: true
        chart-folder: chart
        update-dependencies: false
