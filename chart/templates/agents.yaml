apiVersion: apps/v1
kind: "DaemonSet"
metadata:
  name: {{ include "chart.agents.fullname" . }}
  labels:
    {{- include "chart.agents.labels" . | nindent 4 }}

spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      {{- include "chart.agents.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.agents.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.agents.labels" . | nindent 8 }}
        {{- with .Values.agents.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      {{- with .Values.agents.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $gid := required "agents.containerdGroup is required. Set it to the host GID of the group that owns the containerd socket (see README)." .Values.agents.containerdGroup }}
      {{- $podSecurityContext := merge (dict) (.Values.agents.podSecurityContext | default dict) }}
      {{- $groups := list ($gid | int) }}
      {{- with $podSecurityContext.supplementalGroups }}
      {{- $groups = concat $groups . }}
      {{- end }}
      {{- $_ := set $podSecurityContext "supplementalGroups" $groups }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}

      containers:
      - name: {{ .Chart.Name }}
        {{- with .Values.agents.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: {{ include "chart.imageRef" (dict "root" . "component" "agent" "image" .Values.agents.image) | quote }}
        imagePullPolicy: {{ .Values.agents.image.pullPolicy }}
        {{- $command := .Values.agents.command -}}
        {{- if not $command -}}
        {{- $command = list "/usr/bin/k8s-images-manager-agent/k8s-images-manager-agent" -}}
        {{- end }}
        command:
          {{- toYaml $command | nindent 10 }}

        volumeMounts:
        - name: containerd-socket
          mountPath: /run/k3s/containerd/containerd.sock

        {{- with .Values.agents.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}

        env:
          - name: "PUSH_FREQUENCY_IN_SECOND"
            value: "{{ .Values.agents.config.pushFrequencyInSecond }}"
          - name: "SERVER_URL"
            value: {{ .Values.agents.config.serverUrl | default (printf "http://%s.%s:9999" (include "chart.server.fullname" .) .Release.Namespace) }}
          - name: "RUST_LOG"
            value: {{ .Values.agents.config.logLevel | default "info" | quote }}

          {{- range $key, $value := .Values.agents.env }}
          - name: {{ $key | quote }}
            value: {{ $value | quote }}
          {{- end }}

          {{- range $key, $value := .Values.agents.envFromSecret }}
          - name: {{ $key | quote }}
            valueFrom:
              secretKeyRef:
                name: {{ $value.name | quote }}
                key: {{ $value.key | quote }}
          {{- end }}

      volumes:
      - name: containerd-socket
        hostPath:
          path: /run/k3s/containerd/containerd.sock

      {{- with .Values.agents.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agents.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agents.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
