server:
  replicaCount: 1

  image:
    repository: docker.io/tchoupinax/k8s-images-manager
    pullPolicy: IfNotPresent
    tag: ""

  env: []
  envFromSecret: []

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  service:
    type: ClusterIP
    port: 9999

  metrics:
    enabled: false
    path: /metrics
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      # Labels matched by Prometheus Operator (e.g. release: kube-prometheus-stack).
      additionalLabels: {}
      labels: {}
      annotations: {}
      # Empty scrapes the release namespace. Set matchNames / matchLabels if needed.
      namespaceSelector: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
    - host: chart-example.local
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls: []

  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
    - name: gateway
      sectionName: http
    hostnames:
    - chart-example.local
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /headers

  livenessProbe:
    httpGet:
      path: /health
      port: web
  readinessProbe:
    httpGet:
      path: /health
      port: web

  affinity: {}
  nodeSelector: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  resources: {}
  securityContext: {}
  tolerations: []
  volumeMounts: []
  volumes: []

agents:
  image:
    repository: docker.io/tchoupinax/k8s-images-manager
    pullPolicy: IfNotPresent
    tag: ""

  env: []
  envFromSecret: []

  config:
    pushFrequencyInSecond: 60
    serverUrl: ""
    logLevel: "info"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  affinity: {}
  nodeSelector: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  resources: {}
  securityContext:
    privileged: true # Mandatory to access containerd API
  tolerations: []
  volumeMounts: []
  volumes: []

postgres:
  enabled: false
  image: postgres:18
  password: mysecret
  database: postgres
  user: postgres

webapp:
  enabled: true
  replicaCount: 1

  image:
    repository: docker.io/tchoupinax/k8s-images-manager
    pullPolicy: IfNotPresent
    tag: ""

  env: []
  envFromSecret: []

  config:
    # Public API origin for the browser. Empty uses the current host (/api on the
    # webapp ingress). Set this only when the API is on a different hostname.
    serverUrl: ""

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
    - host: chart-example.local
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls: []

  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
    - name: gateway
      sectionName: http
    hostnames:
    - chart-example.local
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /headers

  affinity: {}
  nodeSelector: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  resources: {}
  securityContext: {}
  tolerations: []
  volumeMounts: []
  volumes: []
